<!DOCTYPE html>
<html>
<head>
  <title>Payment - Galaxy Solutions</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<h1>Complete Your Payment</h1>

<div class="card">
  <h2>Insurance Premium: ₹999</h2>
  <button id="payBtn">Pay Now</button>
</div>

<!-- Razorpay Script -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
document.getElementById('payBtn').onclick = function () {

  var options = {
    key: "YOUR_RAZORPAY_KEY", // 🔴 replace this
    amount: 99900, // amount in paise (₹999)
    currency: "INR",
    name: "Galaxy Solutions",
    description: "Insurance Payment",

    handler: function (response){
      alert("Payment Successful! Payment ID: " + response.razorpay_payment_id);
    }
  };

  var rzp = new Razorpay(options);
  rzp.open();
}
</script>

</body>
</html>
<!DOCTYPE html>
<html>
<head>
  <title>Payment</title>
</head>

<body>

<h2>Insurance Payment</h2>

<input type="text" id="name" placeholder="Name"><br><br>
<input type="email" id="email" placeholder="Email"><br><br>

<button onclick="pay()">Pay ₹500</button>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
async function pay() {

  let name = document.getElementById("name").value;
  let email = document.getElementById("email").value;

  // create order
  let res = await fetch("/create-order", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ amount: 500 })
  });

  let order = await res.json();

  var options = {
    key: "YOUR_KEY_ID",
    amount: order.amount,
    currency: "INR",
    name: "Galaxy Solutions",
    order_id: order.id,

    handler: async function (response) {

      // send to backend
      await fetch("/verify-payment", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
          name,
          email,
          amount: 500,
          paymentId: response.razorpay_payment_id
        })
      });

      alert("Payment Successful!");
    }
  };

  var rzp = new Razorpay(options);
  rzp.open();
}
</script>

</body>
</html>
