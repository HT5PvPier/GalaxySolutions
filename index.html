<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaxy Solutions</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

<style>
body {
  margin:0;
  font-family:'Poppins',sans-serif;
  background:#0b0c2a;
  color:white;
}

header {
  text-align:center;
  padding:100px 20px;
  background:linear-gradient(135deg,#1a1b4b,#3a0ca3);
}

h1 {
  font-size:50px;
}

button {
  padding:15px 30px;
  background:#7209b7;
  border:none;
  color:white;
  font-size:18px;
  border-radius:10px;
  cursor:pointer;
}

.section {
  padding:60px 20px;
  text-align:center;
}

.cards {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
}

.card {
  background:rgba(255,255,255,0.1);
  margin:15px;
  padding:20px;
  border-radius:15px;
  width:250px;
  backdrop-filter: blur(10px);
}

input {
  padding:10px;
  margin:10px;
  width:250px;
  border-radius:8px;
  border:none;
}

footer {
  padding:30px;
  text-align:center;
  background:#111;
}
</style>
</head>

<body>

<header>
  <h1>Galaxy Solutions</h1>
  <p>Protect Your Future with Smart Insurance</p>
  <button>Get Free Quote</button>
</header>

<section class="section">
  <h2>Our Services</h2>
  <div class="cards">
    <div class="card">Life Insurance</div>
    <div class="card">Health Insurance</div>
    <div class="card">Vehicle Insurance</div>
    <div class="card">Travel Insurance</div>
  </div>
</section>

<section class="section">
  <h2>Get a Quote</h2>
  <input type="text" placeholder="Your Name"><br>
  <input type="text" placeholder="Phone Number"><br>
  <button>Submit</button>
</section>

<section class="section">
  <h2>Why Choose Us?</h2>
  <p>Trusted by thousands • Fast claims • Affordable plans</p>
</section>

<footer>
  <p>© 202
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <button id="payBtn">Pay Now</button>
    <script>
var options = {
    "key": "YOUR_KEY_ID", // from Razorpay dashboard
    "amount": "50000", // 500₹ (amount in paise)
    "currency": "INR",
    "name": "Galaxy Solutions",
    "description": "Insurance Payment",
    "handler": function (response){
        alert("Payment Successful!");
    }
};

var rzp = new Razorpay(options);

document.getElementById('payBtn').onclick = function(e){
    rzp.open();
    e.preventDefault();
}
</script>
