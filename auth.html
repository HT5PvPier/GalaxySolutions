<!DOCTYPE html>
<html>
<head>
  <title>Galaxy Solutions - Auth</title>
  <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="container">

  <!-- LEFT SIDE -->
  <div class="left">
    <h1>Galaxy Solutions</h1>
    <p>
      Secure your future with trusted insurance solutions.
      Fast, reliable, and built for your peace of mind.
    </p>
  </div>

  <!-- RIGHT SIDE -->
  <div class="right">

    <!-- Toggle Buttons -->
    <div class="tabs">
      <button onclick="showLogin()" id="loginTab" class="active">Login</button>
      <button onclick="showRegister()" id="registerTab">Register</button>
    </div>

    <!-- LOGIN FORM -->
    <div id="loginForm">
      <h2>Welcome Back</h2>
      <input type="email" placeholder="Email"><br>
      <input type="password" placeholder="Password"><br>
      <button>Login</button>
    </div>

    <!-- REGISTER FORM -->
    <div id="registerForm" style="display:none;">
      <h2>Create Account</h2>
      <input type="text" placeholder="Full Name"><br>
      <input type="email" placeholder="Email"><br>
      <input type="password" placeholder="Password"><br>
      <button>Register</button>
    </div>

  </div>

</div>

<script>
function showLogin() {
  document.getElementById("loginForm").style.display = "block";
  document.getElementById("registerForm").style.display = "none";
  document.getElementById("loginTab").classList.add("active");
  document.getElementById("registerTab").classList.remove("active");
}

function showRegister() {
  document.getElementById("loginForm").style.display = "none";
  document.getElementById("registerForm").style.display = "block";
  document.getElementById("registerTab").classList.add("active");
  document.getElementById("loginTab").classList.remove("active");
}
</script>

</body>
</html>
