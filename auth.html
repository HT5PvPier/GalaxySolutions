<!DOCTYPE html>
<html>
<head>
  <title>Secure Login</title>
  <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-container">

  <!-- LEFT INFO -->
  <div class="left">
    <h1>Galaxy Solutions</h1>
    <p>Advanced protection with secure login verification.</p>
  </div>

  <!-- RIGHT FORM -->
  <div class="right">

    <!-- LOGIN -->
    <div id="loginBox">
      <h2>Login</h2>
      <input type="email" placeholder="Email"><br>
      <input type="password" placeholder="Password"><br>

      <!-- Puzzle -->
      <p>Solve Puzzle to Continue</p>
      <input type="range" id="slider" min="0" max="100" value="0">
      <p id="puzzleMsg"></p>

      <button onclick="checkPuzzle()">Continue</button>
    </div>

    <!-- VERIFY CODE -->
    <div id="verifyBox" style="display:none;">
      <h2>Enter Verification Code</h2>
      <input type="text" placeholder="6-digit code"><br>
      <button onclick="loginSuccess()">Verify</button>
    </div>

  </div>

</div>

<script>
function checkPuzzle() {
  let val = document.getElementById("slider").value;

  if(val > 95) {
    document.getElementById("puzzleMsg").innerText = "Verified ✔";
    setTimeout(() => {
      document.getElementById("loginBox").style.display = "none";
      document.getElementById("verifyBox").style.display = "block";
    }, 1000);
  } else {
    document.getElementById("puzzleMsg").innerText = "Slide to end!";
  }
}

function loginSuccess() {
  alert("Login Successful!");
  window.location.href = "index.html";
}
</script>

</body>
</html>
